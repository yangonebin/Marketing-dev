<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLACKYAK Performance Basecamp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="블랙야크 퍼포먼스 홈">
          <img src="assets/blackyak-modern-logo.png" alt="BLACKYAK" />
        </a>

        <nav aria-label="주요 메뉴">
          <p class="nav-label">REPORT</p>
          <a class="active" href="#overview"><span>01</span>성과 개요</a>
          <a href="#trend"><span>02</span>성과 추이</a>
          <a href="#channels"><span>03</span>매체 분석</a>
          <a href="#branding-performance"><span>04</span>브랜딩/퍼포먼스</a>
        </nav>

        <div class="sidebar-status">
          <span class="status-dot"></span>
          <div><strong>데이터 연결 정상</strong><small>마지막 동기화 · 방금 전</small></div>
        </div>
        <p class="sidebar-note">BLACKYAK © 2026</p>
      </aside>

      <main>
        <header class="page-header">
          <div>
            <p class="eyebrow">PERFORMANCE OVERVIEW <span>·</span> BLACKYAK</p>
            <h1>SUMMARY</h1>
            <p class="subtitle">정상을 향한 모든 캠페인의 움직임을 한눈에 확인하세요.</p>
            <div class="media-filter" aria-label="매체 선택">
              <strong>매체</strong>
              <button class="active" type="button" data-channel="all">전체</button>
              <button type="button" data-channel="Naver">네이버</button>
              <button type="button" data-channel="Meta">메타</button>
              <button type="button" data-channel="Google Ads">구글</button>
              <button type="button" data-channel="other">기타</button>
            </div>
          </div>
          <div class="period-control">
            <span class="period-label">조회 기간</span>
            <button id="period-trigger" class="period-trigger" type="button" aria-expanded="false" aria-controls="period-picker">
              <span class="calendar-icon" aria-hidden="true"></span>
              <strong id="period-summary">어제</strong>
              <span class="period-dates" id="period-dates"></span>
            </button>
            <div id="period-picker" class="period-picker" hidden>
              <div class="date-fields">
                <label>시작일<input id="start-date" type="date" /></label>
                <span aria-hidden="true">—</span>
                <label>종료일<input id="end-date" type="date" /></label>
              </div>
              <div class="period-presets" aria-label="빠른 조회 기간">
                <button type="button" data-period="yesterday" data-days="1">어제</button>
                <button type="button" data-period="7" data-days="7">지난 7일</button>
                <button type="button" data-period="30" data-days="30">지난 30일</button>
                <button type="button" data-period="90" data-days="90">지난 90일</button>
                <button type="button" data-period="this-month">이번 달</button>
                <button type="button" data-period="last-month">지난 달</button>
                <button type="button" data-period="custom">날짜 선택</button>
              </div>
              <div class="period-actions"><button id="period-cancel" type="button">취소</button><button id="period-apply" type="button">적용</button></div>
            </div>
          </div>
        </header>

        <section id="overview" class="metric-grid" aria-label="통합 지표"></section>

        <section id="trend" class="overview-grid">
          <article id="channels" class="panel media-overview-panel">
            <div class="panel-heading">
              <div><p class="section-number">MEDIA OVERVIEW</p><h2>매체별 성과</h2><p class="panel-subtitle">기준: 선택 기간 광고비 비중</p></div>
              <span class="metric-select"><i></i> 광고비</span>
            </div>
            <div id="media-overview" class="media-overview"></div>
          </article>
          <article id="branding-performance" class="panel daily-trend-panel">
            <div class="panel-heading">
              <div><p class="section-number">DAILY TREND</p><h2>일자별 트렌드</h2></div>
              <div class="trend-selects"><span><i class="cost"></i>광고비</span><span><i class="ctr"></i>CTR</span></div>
            </div>
            <div id="daily-trend" class="daily-trend" aria-label="일자별 광고비 및 CTR 추이"></div>
          </article>
        </section>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
